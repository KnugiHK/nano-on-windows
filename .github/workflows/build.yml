name: Build & Release GNU nano for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  LLVM_MINGW_VER: "20261104"

jobs:
  build-x86:
    name: Build x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache downloaded source tarballs
        uses: actions/cache@v6
        with:
          path: build-nano/cache
          key: source-tarballs-x86-${{ hashFiles('build.sh') }}

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            zip \
            wget \
            patch \
            file

      - name: Build x86
        run: |
          chmod +x build.sh
          ./build.sh x86
          mkdir -p build-nano/datafiles/share
          cp -a build-nano/install/x86/share/. build-nano/datafiles/share/
          cp LICENSE build-nano/datafiles/LICENSE
          (cd build-nano/datafiles && zip -rq ../datafiles.zip share LICENSE)

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-x86.exe
          i686-w64-mingw32-objdump -p nano-x86.exe | grep "DLL Name:"

      - name: Attest x86 binary and data archive
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build-nano/nano-x86.exe
            build-nano/datafiles.zip

      - name: Upload x86 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nano-windows-x86
          path: |
            build-nano/nano-x86.exe
            build-nano/datafiles.zip
          if-no-files-found: error

  build-x64:
    name: Build x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache downloaded source tarballs
        uses: actions/cache@v6
        with:
          path: build-nano/cache
          key: source-tarballs-x64-${{ hashFiles('build.sh') }}

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            wget \
            patch \
            file

      - name: Build x64
        run: |
          chmod +x build.sh
          ./build.sh x64

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-x64.exe
          x86_64-w64-mingw32-objdump -p nano-x64.exe | grep "DLL Name:"

      - name: Attest x64 binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build-nano/nano-x64.exe

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nano-windows-x64
          path: |
            build-nano/nano-x64.exe
          if-no-files-found: error

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache downloaded source tarballs
        uses: actions/cache@v6
        with:
          path: build-nano/cache
          key: source-tarballs-arm64-${{ hashFiles('build.sh') }}

      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v6
        with:
          path: build-nano/toolchains/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VER }}-arm64

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            wget \
            patch \
            file

      - name: Build arm64
        run: |
          chmod +x build.sh
          ./build.sh arm64

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-arm64.exe
          ./toolchains/llvm-mingw/bin/aarch64-w64-mingw32-objdump -p nano-arm64.exe | grep "DLL Name:"

      - name: Attest arm64 binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build-nano/nano-arm64.exe

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nano-windows-arm64
          path: |
            build-nano/nano-arm64.exe
          if-no-files-found: error

  package:
    name: Package Build Artifacts
    needs: [build-x86, build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nano-windows-*
          path: dist
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nano-windows-binaries
          path: |
            dist/nano-x86.exe
            dist/nano-x64.exe
            dist/nano-arm64.exe
            dist/datafiles.zip
          if-no-files-found: error

  smoke-test-windows-x64:
    name: Smoke Test on Windows x64 (x86, x64)
    needs: [package]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nano-windows-binaries
          path: build-nano

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run nano_tests.py smoke suite
        run: python nano_tests.py --arch all

  smoke-test-windows-arm64:
    name: Smoke Test on Windows arm64
    needs: [package]
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nano-windows-binaries
          path: build-nano

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run nano_tests.py smoke suite
        run: python nano_tests.py --arch arm64

  release:
    name: Publish GitHub Release
    needs: [package, smoke-test-windows-x64, smoke-test-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nano-windows-binaries
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE.md
          files: |
            dist/nano-x86.exe
            dist/nano-x64.exe
            dist/nano-arm64.exe
            dist/datafiles.zip
          generate_release_notes: true
