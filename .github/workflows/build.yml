name: Build & Release GNU nano for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  LLVM_MINGW_VER: "20250114"

jobs:
  build-x86:
    name: Build x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: build-nano/cache
          key: source-tarballs-x86-${{ hashFiles('build.sh') }}

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            zip \
            unzip \
            wget \
            patch \
            file

      - name: Build x86
        run: |
          chmod +x build.sh
          ./build.sh x86

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-x86.exe
          i686-w64-mingw32-objdump -p nano-x86.exe | grep "DLL Name:"

      - name: Attest x86 binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build-nano/nano-x86.exe
            build-nano/nano-*-win-x86.zip

      - name: Upload x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-x86
          path: |
            build-nano/nano-x86.exe
            build-nano/nano-*-win-x86.zip
          if-no-files-found: error

  build-x64:
    name: Build x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: build-nano/cache
          key: source-tarballs-x64-${{ hashFiles('build.sh') }}

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            zip \
            unzip \
            wget \
            patch \
            file

      - name: Build x64
        run: |
          chmod +x build.sh
          ./build.sh x64

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-x64.exe
          x86_64-w64-mingw32-objdump -p nano-x64.exe | grep "DLL Name:"

      - name: Attest x64 binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build-nano/nano-x64.exe
            build-nano/nano-*-win-x64.zip

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-x64
          path: |
            build-nano/nano-x64.exe
            build-nano/nano-*-win-x64.zip
          if-no-files-found: error

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: build-nano/cache
          key: source-tarballs-arm64-${{ hashFiles('build.sh') }}

      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: build-nano/toolchains/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VER }}-arm64

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            zip \
            unzip \
            wget \
            patch \
            file

      - name: Build arm64
        run: |
          chmod +x build.sh
          ./build.sh arm64

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-arm64.exe
          ./toolchains/llvm-mingw/bin/aarch64-w64-mingw32-objdump -p nano-arm64.exe | grep "DLL Name:"

      - name: Attest arm64 binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build-nano/nano-arm64.exe
            build-nano/nano-*-win-arm64.zip

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-arm64
          path: |
            build-nano/nano-arm64.exe
            build-nano/nano-*-win-arm64.zip
          if-no-files-found: error

  package:
    name: Package Build Artifacts
    needs: [build-x86, build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nano-windows-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum nano-x86.exe nano-x64.exe nano-arm64.exe nano-*-win-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-binaries
          path: dist/*
          if-no-files-found: error

  smoke-test-windows:
    name: Smoke Test on Windows (x86, x64, arm64)
    needs: [package]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nano-windows-binaries
          path: build-nano

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run nano_tests.py smoke suite
        run: python nano_tests.py --arch all

  release:
    name: Publish GitHub Release
    needs: [package, smoke-test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nano-windows-binaries
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          files: |
            dist/nano-x86.exe
            dist/nano-x64.exe
            dist/nano-arm64.exe
            dist/nano-*-win-x86.zip
            dist/nano-*-win-x64.zip
            dist/nano-*-win-arm64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
