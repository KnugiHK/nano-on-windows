name: Build & Release GNU nano for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  LLVM_MINGW_VER: "20250114"

jobs:
  cross-compile:
    name: Cross-Compile (x86, x64, arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: build-nano/cache
          key: source-tarballs-${{ hashFiles('build.sh') }}
          restore-keys: |
            source-tarballs-

      - name: Cache llvm-mingw toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-ucrt-${{ env.LLVM_MINGW_VER }}-x86_64

      - name: Install Ubuntu packages (mingw-w64 & host ncurses-bin)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            pkg-config \
            ncurses-bin \
            ncurses-term \
            texinfo \
            xz-utils \
            zip \
            unzip \
            wget \
            patch \
            file

      - name: Install llvm-mingw for ARM64
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          LLVM_TARBALL="llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/${LLVM_TARBALL}" -O "/tmp/${LLVM_TARBALL}"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "/tmp/${LLVM_TARBALL}" --strip-components=1 -C /opt/llvm-mingw
          rm -f "/tmp/${LLVM_TARBALL}"

      - name: Add llvm-mingw to PATH
        run: echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Build all targets (x86, x64, arm64)
        run: |
          chmod +x build.sh
          ./build.sh all

      - name: Inspect PE headers and DLL imports
        run: |
          cd build-nano
          file nano-x86.exe nano-x64.exe nano-arm64.exe
          echo "=== x86 DLL Imports ==="
          i686-w64-mingw32-objdump -p nano-x86.exe | grep "DLL Name:"
          echo "=== x64 DLL Imports ==="
          x86_64-w64-mingw32-objdump -p nano-x64.exe | grep "DLL Name:"
          echo "=== arm64 DLL Imports ==="
          /opt/llvm-mingw/bin/aarch64-w64-mingw32-objdump -p nano-arm64.exe | grep "DLL Name:"

      - name: Generate SHA256 Checksums
        run: |
          cd build-nano
          sha256sum nano-x86.exe nano-x64.exe nano-arm64.exe nano-*-win-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-windows-binaries
          path: |
            build-nano/nano-x86.exe
            build-nano/nano-x64.exe
            build-nano/nano-arm64.exe
            build-nano/nano-*-win-*.zip
            build-nano/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build-nano/nano-x86.exe
            build-nano/nano-x64.exe
            build-nano/nano-arm64.exe
            build-nano/nano-*-win-*.zip

  smoke-test-windows:
    name: Smoke Test on Windows (x86 & x64 & PE Validation)
    needs: cross-compile
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nano-windows-binaries
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run nano_tests.py smoke suite
        run: python nano_tests.py --arch all

  release:
    name: Publish GitHub Release
    needs: [cross-compile, smoke-test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nano-windows-binaries
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          files: |
            dist/nano-x86.exe
            dist/nano-x64.exe
            dist/nano-arm64.exe
            dist/nano-*-win-x86.zip
            dist/nano-*-win-x64.zip
            dist/nano-*-win-arm64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
